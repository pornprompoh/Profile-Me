  <style>
    html, body { margin: 0; min-height: 100%; background: #eef6ff; }
    body.dark-loading { background: #061322; }
    #loading-screen { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #eef6ff; transition: opacity .45s ease, visibility .45s ease; }
    body.dark-loading #loading-screen { background: #061322; }
    #loading-screen.ready { opacity: 0; visibility: hidden; }
    .loader { width: 68px; height: 68px; border-radius: 50%; border: 7px solid #dbeafe; border-top-color: #2563eb; border-right-color: #38bdf8; animation: spin .9s linear infinite; box-shadow: 0 12px 40px rgba(37,99,235,.18); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen" aria-label="Loading"><div class="loader"></div></div>
  <script>
    (function () {
      let dark = false;
      try {
        const saved = localStorage.getItem('profile_theme');
        dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (_) { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; }
      if (dark) document.body.classList.add('dark-loading');
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading-screen')?.classList.add('ready');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
